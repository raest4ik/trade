[project]
name = "trade-ai-news-mvp"
version = "0.1.0"
description = "MVP API for storing and deduplicating public market news."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0,<1.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "E", "F", "I", "N", "RUF", "UP", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/instruments/domain/normalization.py" = ["RUF001"]
"src/instruments/infrastructure/seed.py" = ["RUF001"]
"tests/integration/test_instrument_api.py" = ["RUF001"]
"tests/unit/test_instrument_matcher.py" = ["RUF001"]
"tests/unit/test_instrument_normalization.py" = ["RUF001"]
"tests/unit/test_instrument_performance.py" = ["RUF001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["apps", "src", "tests"]
venvPath = "."
venv = ".venv"
reportUnusedFunction = false
