services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trade_ai
      POSTGRES_USER: trade_ai
      POSTGRES_PASSWORD: trade_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_ai -d trade_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      APP_NAME: trade-ai-news-mvp
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://trade_ai:trade_ai@postgres:5432/trade_ai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  live-issuer-collector:
    build:
      context: .
      dockerfile: infra/Dockerfile
    profiles:
      - research
    environment:
      APP_NAME: trade-ai-free-live-issuer-collector
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://trade_ai:trade_ai@postgres:5432/trade_ai
      FREE_SOURCES_ONLY: "true"
      MODEL_TRAINING_PERFORMED: "false"
      REAL_TRADING_ALLOWED: "false"
    command:
      - python
      - -m
      - apps.cli.live_issuer_worker
      - --base-main-sha
      - ${BASE_MAIN_SHA:-UNKNOWN}
      - --artifact-root
      - artifacts/free-live-research-operation-v1
      - --poll-interval-minutes
      - ${LIVE_ISSUER_POLL_INTERVAL_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -m apps.cli.live_issuer_health --artifact-root artifacts/free-live-research-operation-v1 >/dev/null
      interval: 1m
      timeout: 10s
      retries: 3

  paper-operation:
    build:
      context: .
      dockerfile: infra/Dockerfile
    profiles:
      - paper
    environment:
      APP_NAME: trade-ai-paper-operation-v1
      ENVIRONMENT: docker
      FREE_SOURCES_ONLY: "true"
      PAPER_EXECUTION_ENABLED: "false"
      REAL_EXECUTION_ENABLED: "false"
      PAPER_OPERATION_SCHEDULE_ENABLED: ${PAPER_OPERATION_SCHEDULE_ENABLED:-false}
      PAPER_OPERATION_TIMEZONE: ${PAPER_OPERATION_TIMEZONE:-Europe/Moscow}
      PAPER_OPERATION_SESSION: ${PAPER_OPERATION_SESSION:-EOD}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      MARKET_CONTEXT_MAX_AGE_SECONDS: ${MARKET_CONTEXT_MAX_AGE_SECONDS:-300}
    command:
      - python
      - -m
      - apps.cli.paper_operation
      - run
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./state:/app/state
    restart: "no"

volumes:
  postgres-data:
