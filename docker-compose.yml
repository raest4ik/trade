services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trade_ai
      POSTGRES_USER: trade_ai
      POSTGRES_PASSWORD: trade_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_ai -d trade_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      APP_NAME: trade-ai-news-mvp
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://trade_ai:trade_ai@postgres:5432/trade_ai
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

